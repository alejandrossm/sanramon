{% if puede_justificar_inasistencias and socio.indicador_asistencia.key == 'bloqueado' %}
    <a
        href="{% url 'usuarios:justificar_inasistencia' socio.pk %}"
        class="btn btn-outline-primary btn-sm px-4"
        title="Justificar inasistencia"
        aria-label="Justificar inasistencia"
    >
        {% include "includes/icon.html" with name="check-circle" %}
    </a>
{% else %}
    <button
        type="button"
        class="btn btn-outline-secondary btn-sm px-4"
        title="Gestionar estado"
        aria-label="Gestionar estado"
        disabled
    >
        {% include "includes/icon.html" with name="activity" %}
    </button>
{% endif %}
