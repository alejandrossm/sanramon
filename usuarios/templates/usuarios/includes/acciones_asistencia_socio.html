<div class="d-inline-flex gap-2 justify-content-end">
    {% if puede_justificar_inasistencias and socio.indicador_asistencia.key == 'bloqueado' %}
        <a
            href="{% url 'usuarios:detalle_asistencia_socio' socio.pk %}"
            class="btn btn-outline-primary btn-sm"
            title="Ver detalle para justificar inasistencia"
            aria-label="Ver detalle para justificar inasistencia"
        >
            {% include "includes/icon.html" with name="eye" %}
        </a>
    {% else %}
        <a
            href="{% url 'usuarios:detalle_asistencia_socio' socio.pk %}"
            class="btn btn-outline-primary btn-sm"
            title="Ver detalle de asistencia"
            aria-label="Ver detalle de asistencia"
        >
            {% include "includes/icon.html" with name="eye" %}
        </a>
    {% endif %}
</div>
